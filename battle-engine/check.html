<!DOCTYPE html>
<html lang="ja"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>四月島・旧端末診断</title><style>body{font:16px/1.6 Arial,Meiryo,sans-serif;background:#f7f6ef;color:#263d4c;padding:15px}h1{font-size:21px}#js{background:#ffe4d6;padding:14px;border:1px solid #e4baa4}#info{word-wrap:break-word;padding:12px;background:#edf2f3}</style></head><body>
<h1>四月島・古い端末の動作確認</h1>
<p>この画面は軽量な診断用です。機種名などの情報は送信しません。表示をエクエスさんから教えてもらうだけで大丈夫です。</p>

<pre id="info">端末情報の確認待ち</pre>
<noscript><p>JavaScriptが無効です。ブラウザの設定を確認してください。</p></noscript>
<script type="text/javascript">
(function(){try{var e=document.getElementById('js'),i=document.getElementById('info');e.innerHTML='JavaScriptは動作しています。';e.style.background='#dcf2df';var text='ブラウザ情報:\n'+navigator.userAgent+'\n\n';text+='ES5機能: '+(Array.prototype.map&&Object.keys&&JSON?'利用可':'一部未対応');i.innerHTML='';if(typeof i.textContent!=='undefined')i.textContent=text;else i.innerText=text;}catch(ex){document.getElementById('js').innerHTML='診断スクリプトでエラー: '+ex.message;}})();
